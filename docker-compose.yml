version: '3.8'

services:
  postgres:
    image: postgres:16.3-alpine
    container_name: forecasting_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forecaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forecaster_pass}
      POSTGRES_DB: ${POSTGRES_DB:-demand_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forecaster} -d ${POSTGRES_DB:-demand_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: