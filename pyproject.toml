[project]
name = "demand-forecasting"
version = "0.1.0"
description = "Production demand forecasting pipeline"
requires-python = ">=3.12"
dependencies = ["pandas (>=3.0.5,<4.0.0)", "scikit-learn (>=1.9.0,<2.0.0)", "lightgbm (>=4.7.0,<5.0.0)", "sqlalchemy (>=2.0.51,<3.0.0)", "psycopg2-binary (>=2.9.12,<3.0.0)", "pydantic (>=2.13.4,<3.0.0)", "pydantic-settings (>=2.14.2,<3.0.0)", "fastapi (>=0.141.1,<0.142.0)", "uvicorn (>=0.52.1,<0.53.0)", "numpy (>=2.5.2,<3.0.0)", "matplotlib (>=3.11.1,<4.0.0)", "seaborn (>=0.13.2,<0.14.0)", "statsmodels (>=0.14.6,<0.15.0)", "pyarrow (>=25.0.1,<26.0.0)", "fastparquet (>=2026.5.0,<2027.0.0)"]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.1,<0.17.0)",
    "black (>=26.5.1,<27.0.0)",
    "jupyterlab (>=4.6.2,<5.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)"
]
